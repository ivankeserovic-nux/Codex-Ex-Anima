<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Codex Test"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>Codex ex Anima · Test</title><style>html,body{margin:0;width:100%;height:100%;background:#090c16;color:#f5d8ce;font-family:system-ui,sans-serif;overflow:hidden}#game{border:0;position:fixed;inset:0;width:100%;height:100%;height:100dvh}#tools{position:fixed;top:calc(env(safe-area-inset-top) + 4px);left:50%;transform:translateX(-50%);z-index:50;display:none;align-items:center;gap:9px;background:#111525e8;border:1px solid #a35b7c;border-radius:0 0 10px 10px;padding:6px 10px;font-size:12px}#tools button,#install{background:#56253e;border:1px solid #d38aa3;color:#fff;border-radius:7px;padding:8px;font-weight:bold}#tools[open]{display:flex}#toggle{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 5px);left:50%;transform:translateX(-50%);z-index:51;opacity:.65;background:#141524;color:#fff;border:1px solid #975b7a;border-radius:15px;padding:4px 12px;font-size:11px}#installBox{position:fixed;inset:0;z-index:70;background:#090c16f5;display:flex;justify-content:center;align-items:center;padding:25px}#installBox[hidden]{display:none}#card{max-width:430px;background:#171a2c;border:1px solid #b56889;border-radius:18px;padding:24px;line-height:1.5}#card h1{font-size:22px}#card p{font-size:14px}#card button{margin:4px;padding:10px 16px}#close{background:transparent;color:#fff;border:1px solid #a47a8a;border-radius:8px}#notice{font-size:12px;color:#f0b5b5}#toggle{display:none}body.standalone #toggle{display:block}body.standalone #tools[open]~#toggle{display:block}</style></head><body><iframe id="game" title="Codex ex Anima"></iframe><div id="tools"><span id="version">...</span><button id="refresh">AGGIORNA</button><button id="rollback">PRECEDENTE</button></div><button id="toggle" aria-label="Opzioni test">⚙ TEST</button><div id="installBox" hidden><div id="card"><h1>Codex ex Anima · Test</h1><p>Installa questa app una sola volta. Le versioni successive si aggiornano dalla stessa icona, senza reinstallazione.</p><p id="instructions"></p><button id="install">INSTALLA</button><button id="close">CONTINUA NEL BROWSER</button><p id="notice"></p></div></div><script>
'use strict';const $=s=>document.querySelector(s),frame=$('#game');let release=null,previous=null,promptEvent=null;const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;document.body.classList.toggle('standalone',isStandalone);const BASE=new URL('./',location.href);function urlFor(name,v){const u=new URL(name,BASE);u.searchParams.set('v',v||Date.now());return u.href}function launch(r){frame.src=urlFor(r.game,r.version);$('#version').textContent='v '+r.version;release=r}async function checkUpdate(force=false){try{const res=await fetch(urlFor('release.json',Date.now()),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(!data.version||!/^[-\w.]+\.html$/.test(data.game))throw Error('release.json non valido');if(!release){launch(data)}else if(data.version!==release.version||force){previous=release;launch(data)}return true}catch(e){$('#notice').textContent='Aggiornamento non disponibile: '+e.message;if(!release){frame.src=urlFor('game.html','offline')}return false}}$('#refresh').onclick=()=>checkUpdate(true);$('#rollback').onclick=()=>{if(previous){const p=previous;previous=release;launch(p)}else alert('Nessuna versione precedente caricata in questa sessione')};$('#toggle').onclick=()=>$('#tools').toggleAttribute('open');window.addEventListener('pageshow',()=>checkUpdate(false));document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false)});setInterval(()=>{if(!document.hidden)checkUpdate(false)},60000);checkUpdate();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;$('#install').hidden=false});$('#install').onclick=async()=>{if(promptEvent){await promptEvent.prompt();promptEvent=null;$('#installBox').hidden=true}else $('#notice').textContent='Usa il menu Condividi del browser e scegli Aggiungi alla schermata Home.'};$('#close').onclick=()=>{$('#installBox').hidden=true};if(!isStandalone&&!sessionStorage.getItem('codex-install-tip')){const ua=navigator.userAgent;const ios=/iPad|iPhone|iPod/.test(ua);$('#instructions').textContent=ios?'Su iPhone: Condividi → Aggiungi alla schermata Home → Apri come app (se disponibile) → Aggiungi. Chrome e Firefox su iOS possono mostrare voci differenti.':'Su Android: usa Installa app dal menu del browser, oppure il pulsante INSTALLA se disponibile.';$('#install').hidden=true;$('#installBox').hidden=false;sessionStorage.setItem('codex-install-tip','1')}
</script></body></html>
